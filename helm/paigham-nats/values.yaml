# Default values for paigham-nats.

replicaCount: 1

image:
  repository: ghcr.io/paigham/paigham-nats
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: paigham-nats.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: paigham-nats-tls
  #    hosts:
  #      - paigham-nats.local

gateway:
  # Enable Gateway API HTTPRoute (alternative to Ingress)
  enabled: false
  # Parent gateway references
  parentRefs: []
    # - name: my-gateway
    #   namespace: default
    #   sectionName: https  # optional
  # Hostnames for the HTTPRoute
  hostnames: []
    # - paigham.example.com

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration
config:
  # NATS server URL
  natsUrl: "nats://nats:4222"
  # Authentication mode: "none" or "google"
  authMode: "none"
  # Base URL for OAuth redirects (required if authMode is "google")
  baseUrl: ""
  # Comma-separated list of allowed email addresses (empty = all authenticated users)
  allowedUsers: ""

# Reference an existing Kubernetes secret for sensitive credentials.
# Required when authMode is "google". The secret must contain:
#
#   GOOGLE_CLIENT_ID     - Google OAuth client ID
#   GOOGLE_CLIENT_SECRET - Google OAuth client secret
#   SESSION_SECRET       - Cookie encryption key (optional; auto-generated if omitted)
#
# Create the secret with kubectl:
#   kubectl create secret generic paigham-oauth \
#     --from-literal=GOOGLE_CLIENT_ID=your-client-id.apps.googleusercontent.com \
#     --from-literal=GOOGLE_CLIENT_SECRET=your-client-secret \
#     --from-literal=SESSION_SECRET=$(openssl rand -hex 32)
#
# Or as a manifest (use sealed-secrets / external-secrets in production):
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: paigham-oauth
#   type: Opaque
#   stringData:
#     GOOGLE_CLIENT_ID: "your-client-id.apps.googleusercontent.com"
#     GOOGLE_CLIENT_SECRET: "your-client-secret"
#     SESSION_SECRET: "a-random-32-char-string"
existingSecret: ""
