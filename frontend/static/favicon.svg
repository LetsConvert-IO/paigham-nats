<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
	<!-- Background circle -->
	<circle cx="32" cy="32" r="30" fill="#1e293b"/>

	<!-- Pigeon body -->
	<ellipse cx="32" cy="34" rx="14" ry="10" fill="#94a3b8"/>

	<!-- Pigeon head -->
	<circle cx="42" cy="26" r="7" fill="#94a3b8"/>

	<!-- Eye -->
	<circle cx="44" cy="25" r="1.5" fill="#1e293b"/>

	<!-- Beak -->
	<polygon points="49,26 54,28 49,30" fill="#f59e0b"/>

	<!-- Wing -->
	<ellipse cx="28" cy="33" rx="8" ry="5" fill="#64748b"/>

	<!-- Tail feathers -->
	<polygon points="18,34 12,30 14,34 12,38 18,34" fill="#64748b"/>

	<!-- Note/Letter attached to leg -->
	<rect x="30" y="44" width="8" height="6" rx="1" fill="#3b82f6"/>
	<line x1="32" y1="46" x2="36" y2="46" stroke="#fff" stroke-width="1"/>
	<line x1="32" y1="48" x2="36" y2="48" stroke="#fff" stroke-width="1"/>
</svg>
